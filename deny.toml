# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`.

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "OFL-1.1",
  "CC0-1.0",
  "BSL-1.0",
]

# egui's default fonts bundle the Ubuntu font family.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["Ubuntu-font-1.0"]

# The library itself is unpublished (`publish = false`); its licence is MIT OR Apache-2.0.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
