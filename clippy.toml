# Clippy configuration. The lint levels are in Cargo.toml ([lints]).

avoid-breaking-exported-api = false

# Tests may unwrap, expect, panic and print: a panic there is a failed assertion.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true

doc-valid-idents = ["..", "AltGr", "JetBrains", "NecturaLabs", "OpenGL", "Wayland", "egui", "eframe", "egui_glow"]
allowed-wildcard-imports = ["super"]
[[disallowed-methods]]
path = "egui::Color32::from_rgb"
reason = "colours come only from src/theme.rs"
