name: Feature
description: A new component, variant or token, or a change to an existing one.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What an application cannot do or show today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The component or change, and how it fits the theme tokens.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Checkable points, including the gallery states and themes to screenshot.
    validations:
      required: true
