version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      egui:
        patterns: ["egui", "eframe", "egui-*", "epaint", "emath", "ecolor"]
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"

  # Actions are pinned to full commit SHAs with the version in a trailing comment; Dependabot
  # updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
