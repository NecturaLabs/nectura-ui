name: CI

# Every push and every pull request (forks included) runs the library's own checks on
# GitHub-hosted runners. The repository is public, so no job ever runs on a self-hosted runner.
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly, so a new RustSec advisory shows up without a code change.
    - cron: "23 6 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, clippy and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      # A pull request reads the cache but only main writes it, so a branch cannot poison it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the windowing libraries the dev build links
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libwayland-dev wayland-protocols libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      # A plain build of the library picks no windowing backend (the application does), so the
      # documentation build names the two the tests use.
      - name: Documentation builds without warnings
        run: cargo doc --no-deps --features eframe/wayland,eframe/x11
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Minimum supported Rust (1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.95"
      - name: Install the windowing libraries the dev build links
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libwayland-dev wayland-protocols libxkbcommon-dev
      - run: cargo check --all-targets

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny
      - run: cargo deny check
